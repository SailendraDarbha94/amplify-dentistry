name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Generate Drift code
        run: dart run melos run gen

      - name: Format check
        run: dart run melos run format:check

      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart run melos run gen
      - name: Build debug APK
        working-directory: apps/app_mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/app_mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
