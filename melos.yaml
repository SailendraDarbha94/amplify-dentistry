name: amplify_dentistry

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    runPubGetInParallel: false

scripts:
  analyze:
    description: Static analysis for every package.
    run: melos exec -c 1 -- "flutter analyze --no-fatal-infos"
  test:
    description: Run tests in every package that has a test directory.
    run: melos exec -c 1 --dir-exists=test -- "flutter test"
  format:
    description: Format all Dart code.
    run: dart format .
  format:check:
    run: dart format --output=none --set-exit-if-changed .
  gen:
    description: Run build_runner in packages that use code generation.
    run: melos exec -c 1 --depends-on=build_runner -- "dart run build_runner build --delete-conflicting-outputs"
