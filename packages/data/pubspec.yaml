name: ampdent_data
description: "Offline-first local store (Drift/SQLite) with repositories, audit log, and Supabase sync (outbox push, watermark pull)."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  ampdent_core:
    path: ../core
  ampdent_terminology:
    path: ../terminology
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.0
  collection: ^1.19.0
  crypto: ^3.0.6
  supabase: ^2.16.0
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.5.0
  fake_async: ^1.3.3
